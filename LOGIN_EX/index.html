<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="title">Faça seu login</h1>
        <div class="login">
            <form action="#" method="post">
                <label for="usuario">Email ou nome de usuário</label>
                <input type="text" autocomplete="username" id="usuario" name="usuario" placeholder="email ou nome de usuario" required>
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="digite a senha"  autocomplete="current-password" required>
                <button type="submit">Login</button>
            </form>
            <a href="#">Esqueceu sua senha?</a>
            <a href="#">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
